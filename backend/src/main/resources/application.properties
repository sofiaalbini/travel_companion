spring.datasource.url=jdbc:postgresql://localhost:5433/tourmate
spring.datasource.username=postgres
spring.datasource.password=<enter your password>
spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate dialect for Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
logging.level.org.springframework.security=DEBUG

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Local dev frontend
cors.allowed-origins[0]=http://localhost:4200
# Production frontend (will be implemented in the future)
cors.allowed-origins[1]=https://ourtourmate.com